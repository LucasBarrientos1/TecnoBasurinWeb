<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - TecnoBasurin</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header dinámico -->
    <header id="site-header"></header>
    
    <div class="registro-container">
    <div class="registro-box">
      <h2>Crear Cuenta</h2>
      <form id="registroForm">
        <div class="input-group">
          <label for="nombre">Nombre Completo</label>
          <input type="text" id="nombre" required placeholder="Tu nombre completo">
        </div>

        <div class="input-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" required placeholder="ejemplo@correo.com">
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="********">
        </div>

        <button type="submit" class="btn-tech">Registrarse</button>
      </form>

      <div class="registro-links">
        <a href="login.html" class="btn-back">← Volver al Login</a>
      </div>
    </div>
  </div>

  <footer class="main-footer" id="site-footer"></footer>

  <script>
    document.getElementById("registroForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    await api('/registro', { method: 'POST', body: {
      nombre: document.getElementById("nombre").value,
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    }});
    alert("Registro exitoso. Ahora iniciá sesión.");
    location.href = "login.html";
  } catch (err) { alert(err.message); }
});
  </script>
  
    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/layout.js"></script>
    
</body>
</html>
