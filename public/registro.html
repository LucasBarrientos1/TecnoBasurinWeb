<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - TecnoBasurin</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header dinámico -->
    <header id="site-header"></header>
    
    <main class="registro-container">
    <div class="registro-box">
        <h2>Crear Cuenta</h2>
        <form id="register-form">
            <div class="input-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" placeholder="Ej. Lucas Barrientos" required>
            </div>
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="tu-email@ejemplo.com" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <!-- Casilla de aceptación añadida -->
            <div class="checkbox-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="acepta-terminos" required>
                    <span>Acepto los <a href="legal.html#terminos" target="_blank">Términos</a>, <a href="legal.html#privacidad" target="_blank">Privacidad</a> y <a href="legal.html#bases" target="_blank">Bases y Condiciones</a>.</span>
                </label>
            </div>

            <button type="submit" class="btn-tech">Registrarse</button>
        </form>
        <div class="registro-links">
            <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
    </div>
</main>

    <!-- Footer dinámico -->
    <div id="footer-container"></div>

    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/layout.js"></script>
</body>
</html>
